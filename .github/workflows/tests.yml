name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS carries the launchd backend, which had zero CI coverage while
        # three consecutive waves rewrote it.
        include:
          - { os: ubuntu-latest, python-version: '3.11' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: ubuntu-latest, python-version: '3.13' }
          - { os: macos-latest,  python-version: '3.13' }
    steps:
      - uses: actions/checkout@v4

      # The /cleanup-worktree merge check is executed by the agent's shell, so
      # its test runs the snippet under both. The runner images carry bash;
      # only macOS carries zsh, and a missing shell skips rather than fails.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} pytest

      - name: Run ruff
        run: uv run --frozen --python ${{ matrix.python-version }} ruff check src tests

  # Third leg of the pre-commit gate. docs.yml only runs on push to main, so
  # without this no pull request would ever build the docs.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install docs dependencies
        run: uv sync --group docs --python 3.11

      - name: Build site
        run: uv run --frozen --python 3.11 mkdocs build --strict
